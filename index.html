<!DOCTYPE html>

<html>
    <head>
        <title>My Ecommerce Website</title>
        <link rel="stylesheet" href="style.css">
        <script src="main.js" defer></script>
        <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet">
    </head>
    <body>
    <header>
        <a href="#" class="logo">Ecommerce</a>
        <div id="cart-icon">
            <i class="ri-shopping-bag-line"></i>
            <span class="cart-item-count"></span>
        </div>
    </header>

    <div class="cart">
        <h2 class="cart-title">Your Cart</h2>
         <div class="cart-content">

            
        </div>
        <div class="total">
            <div class="total-title">Total</div>
            <div class="total-price">$0</div>
        </div>
        <button class="btn-buy">Buy Now</button>
        <i class="ri-close-line" id="cart-close"></i>
        
    </div>

    <section class="shop">
      <h1 class="section-title">Shop Products</h1>
      <div class="product-content">
        <div class="product-box">
            <div class="img-box">
                <img src="images/product1.jpg">
            </div>
            <h2 class="product-title">Casual Black Polo</h2>
            <div class="price-and-cart">
                <span class="price">$100</span>
                <i class="ri-shopping-bag-line add-cart"></i>
            </div>
        </div>


        <div class="product-box">
            <div class="img-box">
                <img src="images/product2.jpg">
            </div>
            <h2 class="product-title">Brown Sweatshirt</h2>
            <div class="price-and-cart">
                <span class="price">$50</span>
                <i class="ri-shopping-bag-line add-cart"></i>
            </div>
        </div>


        <div class="product-box">
            <div class="img-box">
                <img src="images/product3.jpg">
            </div>
            <h2 class="product-title">Casual BLue Round Neck</h2>
            <div class="price-and-cart">
                <span class="price">$80</span>
                <i class="ri-shopping-bag-line add-cart"></i>
            </div>
        </div>


        <div class="product-box">
            <div class="img-box">
                <img src="images/product4.jpg">
            </div>
            <h2 class="product-title">Orange </h2>
            <div class="price-and-cart">
                <span class="price">$100</span>
                <i class="ri-shopping-bag-line add-cart"></i>
            </div>
        </div>


        <div class="product-box">
            <div class="img-box">
                <img src="images/product5.jpg">
            </div>
            <h2 class="product-title">Black Jacket</h2>
            <div class="price-and-cart">
                <span class="price">$70</span>
                <i class="ri-shopping-bag-line add-cart"></i>
            </div>
        </div>


        <div class="product-box">
            <div class="img-box">
                <img src="images/product6.jpg">
            </div>
            <h2 class="product-title">Grey Jacket</h2>
            <div class="price-and-cart">
                <span class="price">$100</span>
                <i class="ri-shopping-bag-line add-cart"></i>
            </div>
        </div>


        <div class="product-box">
            <div class="img-box">
                <img src="images/product7.jpg">
            </div>
            <h2 class="product-title">Olive Hoodie</h2>
            <div class="price-and-cart">
                <span class="price">$100</span>
                <i class="ri-shopping-bag-line add-cart"></i>
            </div>
        </div>


        <div class="product-box">
            <div class="img-box">
                <img src="images/product8.jpg">
            </div>
            <h2 class="product-title">Yellow Tshirt</h2>
            <div class="price-and-cart">
                <span class="price">$100</span>
                <i class="ri-shopping-bag-line add-cart"></i>
            </div>
        </div>
      </div>

    </section>
    </body>
</html>
